name: Update GitHub Stats

on:
  schedule:
    # Jalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Agar bisa dijalankan manual kapan saja

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ambil Statistik dari GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: adithairun
        run: |
          node << 'EOF'
          const fs = require('fs');

          async function ghGraphQL(query, variables = {}) {
            const res = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                Authorization: `bearer ${process.env.GH_TOKEN}`,
                'Content-Type': 'application/json',
                'User-Agent': 'github-actions-stats'
              },
              body: JSON.stringify({ query, variables })
            });
            const json = await res.json();
            if (json.errors) throw new Error(JSON.stringify(json.errors));
            return json.data;
          }

          async function main() {
            const login = process.env.USERNAME;

            const baseQuery = `
              query($login: String!) {
                user(login: $login) {
                  createdAt
                  pullRequests { totalCount }
                  issues { totalCount }
                  repositories(first: 100, ownerAffiliations: OWNER, isFork: false, privacy: PUBLIC) {
                    nodes {
                      stargazerCount
                      languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                        edges {
                          size
                          node { name color }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const { user } = await ghGraphQL(baseQuery, { login });

            // Hitung total commit dari awal akun dibuat hingga tahun ini
            const startYear = new Date(user.createdAt).getFullYear();
            const currentYear = new Date().getFullYear();
            let totalCommits = 0;

            const commitQuery = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                  }
                }
              }
            `;

            for (let y = startYear; y <= currentYear; y++) {
              const data = await ghGraphQL(commitQuery, {
                login,
                from: `${y}-01-01T00:00:00Z`,
                to: `${y}-12-31T23:59:59Z`
              });
              totalCommits += data.user.contributionsCollection.totalCommitContributions;
            }

            // Hitung total stars & ukuran bahasa pemrograman
            let totalStars = 0;
            const langMap = {};

            for (const repo of user.repositories.nodes) {
              totalStars += repo.stargazerCount;
              for (const edge of repo.languages.edges) {
                const { name, color } = edge.node;
                if (!langMap[name]) {
                  langMap[name] = { name, color: color || '#888888', size: 0 };
                }
                langMap[name].size += edge.size;
              }
            }

            const sortedLangs = Object.values(langMap).sort((a, b) => b.size - a.size).slice(0, 6);
            const totalSize = sortedLangs.reduce((sum, item) => sum + item.size, 0);

            const languages = sortedLangs.map((item) => ({
              name: item.name,
              color: item.color,
              pct: totalSize > 0 ? ((item.size / totalSize) * 100).toFixed(2) : '0.00'
            }));

            const output = {
              updatedAt: new Date().toISOString().split('T')[0],
              commits: totalCommits,
              stars: totalStars,
              prs: user.pullRequests.totalCount,
              issues: user.issues.totalCount,
              languages
            };

            fs.writeFileSync('stats.json', JSON.stringify(output, null, 2));
          }

          main();
          EOF

      - name: Simpan dan Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "chore: update github stats"
          git push
